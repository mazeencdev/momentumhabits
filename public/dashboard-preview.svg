  <!-- Top right icons -->
  <!-- Email icon -->
  <circle cx="1086" cy="48" r="18" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="1086" y="54" text-anchor="middle" font-size="14" fill="#6b7280">✉</text>

