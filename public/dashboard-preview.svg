  <!-- Habit item -->
  <text x="344" y="375" font-size="22">💪</text>
  <text x="374" y="370" font-size="14" font-weight="600" fill="#111827">working out</text>
  <text x="374" y="389" font-size="12" fill="#9ca3af">Daily</text>
  <text x="1240" y="373" font-size="13" fill="#6b7280">Fitness</text>
  <!-- Checkbox circle -->
  <circle cx="1378" cy="370" r="12" fill="none" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Bottom row -->
  <!-- This Week chart -->
  <rect x="320" y="580" width="540" height="216" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="336" y="614" font-size="16" font-weight="600" fill="#111827">This Week</text>
  <text x="336" y="634" font-size="12" fill="#9ca3af">Daily completion rate</text>

  <!-- Day labels -->
  <text x="366" y="776" text-anchor="middle" font-size="11" fill="#9ca3af">Mon</text>
  <text x="434" y="776" text-anchor="middle" font-size="11" fill="#9ca3af">Tue</text>
  <text x="502" y="776" text-anchor="middle" font-size="11" fill="#9ca3af">Wed</text>
  <text x="570" y="776" text-anchor="middle" font-size="11" fill="#9ca3af">Thu</text>
  <text x="638" y="776" text-anchor="middle" font-size="11" fill="#9ca3af">Fri</text>
  <text x="706" y="776" text-anchor="middle" font-size="11" fill="#9ca3af">Sat</text>
  <text x="774" y="776" text-anchor="middle" font-size="11" fill="#9ca3af">Sun</text>
  <!-- Chart baseline -->
  <line x1="336" y1="762" x2="844" y2="762" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Monthly Progress -->
  <rect x="876" y="580" width="400" height="216" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="892" y="614" font-size="16" font-weight="600" fill="#111827">Monthly Progress</text>

  <!-- Donut ring -->
  <circle cx="940" cy="706" r="46" fill="none" stroke="#e5e7eb" stroke-width="10"/>
  <circle cx="940" cy="706" r="46" fill="none" stroke="#2D6A4F" stroke-width="10"
          stroke-dasharray="29 260" stroke-linecap="round" transform="rotate(-90 940 706)"/>
  <text x="940" y="712" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">7%</text>

  <text x="1000" y="696" font-size="14" font-weight="600" fill="#111827">Just getting started!</text>
  <text x="1000" y="714" font-size="12" fill="#6b7280">You've completed 7% of your</text>
  <text x="1000" y="730" font-size="12" fill="#6b7280">habits this month.</text>
  <text x="892" y="780" font-size="12" fill="#9ca3af">Keep it up!</text>

  <!-- Daily Motivation card -->
  <rect x="1292" y="580" width="332" height="216" rx="12" fill="#2D6A4F"/>
  <text x="1308" y="614" font-size="10" font-weight="600" fill="#86efac" letter-spacing="1.5">DAILY MOTIVATION</text>
  <!-- Quote marks (decorative) -->
  <text x="1308" y="660" font-size="14" fill="white" opacity="0.9">"Small habits don't add up, they</text>
  <text x="1308" y="682" font-size="14" fill="white" opacity="0.9">compound. That's the power of</text>
  <text x="1308" y="704" font-size="14" fill="white" opacity="0.9">Momentum."</text>
  <line x1="1308" y1="728" x2="1340" y2="728" stroke="#86efac" stroke-width="1.5"/>
  <text x="1308" y="750" font-size="12" fill="#86efac">— James Clear</text>
