<svg viewBox="0 0 1440 828" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="1440" height="828" fill="#f5f5f5"/>

  <!-- Sidebar -->
  <rect x="16" y="16" width="272" height="796" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Logo area -->
  <!-- Momentum green icon -->
  <rect x="32" y="32" width="36" height="36" rx="8" fill="#2D6A4F"/>
