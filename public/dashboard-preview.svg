  <circle cx="1194" cy="48" r="20" fill="#2D6A4F"/>
  <text x="1194" y="54" text-anchor="middle" font-size="14" font-weight="bold" fill="white">R</text>
  <text x="1222" y="43" font-size="13" font-weight="600" fill="#111827">Random</text>
  <text x="1222" y="59" font-size="11" fill="#6b7280">mazeen.chawdhury@gmail.com</text>

