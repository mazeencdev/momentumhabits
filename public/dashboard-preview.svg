  <text x="1022" y="172" font-size="22">⭐</text>
  <text x="864" y="220" font-size="32" font-weight="700" fill="#111827">0%</text>
  <text x="864" y="254" font-size="12" fill="#9ca3af">This week</text>

  <!-- Card 4: Categories -->
  <rect x="1112" y="152" width="292" height="116" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="1128" y="178" font-size="13" fill="#6b7280">Categories</text>
  <text x="1378" y="172" font-size="22">🗂</text>
  <text x="1128" y="220" font-size="32" font-weight="700" fill="#111827">1</text>
