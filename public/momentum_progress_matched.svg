<svg width="900" height="550" viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg">

<!-- Background -->
<rect width="900" height="550" fill="#F6F7F9"/>

<!-- Sidebar -->
<rect x="0" y="0" width="180" height="550" fill="#FFFFFF"/>
<text x="30" y="40" font-size="18" fill="#1F2937">Momentum</text>

<!-- Sidebar items -->
<rect x="20" y="80" width="140" height="32" rx="8" fill="#D1FAE5"/>
<text x="35" y="100" font-size="12" fill="#065F46">Dashboard</text>
<text x="35" y="130" font-size="12" fill="#6B7280">My Habits</text>
<text x="35" y="155" font-size="12" fill="#6B7280">Progress</text>
<text x="35" y="180" font-size="12" fill="#6B7280">Calendar</text>

<!-- Header -->
<text x="200" y="40" font-size="16" fill="#111827">Good morning, Maz</text>

<!-- Stat Cards -->
<rect x="200" y="60" width="150" height="70" rx="10" fill="#FFFFFF"/>
<text x="215" y="90" font-size="11" fill="#6B7280">Current Streak</text>
<text x="215" y="115" font-size="18" fill="#111827">14</text>

<rect x="370" y="60" width="150" height="70" rx="10" fill="#FFFFFF"/>
<text x="385" y="90" font-size="11" fill="#6B7280">Today's Progress</text>
<text x="385" y="115" font-size="18" fill="#111827">4</text>

<rect x="540" y="60" width="150" height="70" rx="10" fill="#FFFFFF"/>
<text x="555" y="90" font-size="11" fill="#6B7280">Weekly Rate</text>
<text x="555" y="115" font-size="18" fill="#111827">86%</text>

<rect x="710" y="60" width="150" height="70" rx="10" fill="#FFFFFF"/>
<text x="725" y="90" font-size="11" fill="#6B7280">Total Habits</text>
<text x="725" y="115" font-size="18" fill="#111827">6</text>

<!-- Task List -->
<rect x="200" y="150" width="450" height="220" rx="12" fill="#FFFFFF"/>
<text x="215" y="175" font-size="13" fill="#111827">Today's Habits</text>

<!-- Sample tasks -->
<rect x="215" y="190" width="410" height="30" rx="8" fill="#F3F4F6"/>
<text x="225" y="210" font-size="12" fill="#374151">Morning Run</text>

<rect x="215" y="230" width="410" height="30" rx="8" fill="#F3F4F6"/>
<text x="225" y="250" font-size="12" fill="#374151">Drink Water</text>

<rect x="215" y="270" width="410" height="30" rx="8" fill="#F3F4F6"/>
<text x="225" y="290" font-size="12" fill="#374151">Read 20 Pages</text>

<!-- Progress Rings -->
<rect x="670" y="150" width="190" height="220" rx="12" fill="#FFFFFF"/>
<text x="690" y="175" font-size="13" fill="#111827">Completion</text>

<circle cx="720" cy="250" r="35" stroke="#D1FAE5" stroke-width="8" fill="none"/>
<circle cx="720" cy="250" r="35" stroke="#10B981" stroke-width="8" stroke-dasharray="180 220" fill="none"/>

<circle cx="800" cy="250" r="35" stroke="#D1FAE5" stroke-width="8" fill="none"/>
<circle cx="800" cy="250" r="35" stroke="#10B981" stroke-width="8" stroke-dasharray="200 220" fill="none"/>

<!-- Bottom Chart -->
<rect x="200" y="390" width="660" height="130" rx="12" fill="#FFFFFF"/>

<polyline points="220,480 300,450 380,460 460,430 540,440 620,420 700,430"
stroke="#10B981" stroke-width="3" fill="none"/>

</svg>
